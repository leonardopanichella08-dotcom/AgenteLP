<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Reels Trattamenti</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Reels Trattamenti</div>
    <nav class="tabs" role="tablist">
      <button data-tab="upload" role="tab">Carica</button>
      <button data-tab="tag" role="tab">Classifica <span class="badge" id="todo-badge"></span></button>
      <button data-tab="folders" role="tab">Cartelle</button>
    </nav>
  </header>
  <div class="progress" aria-live="polite">
    <div class="progress-row"><strong id="progress-text">…</strong><span id="progress-detail" class="muted"></span></div>
    <div class="progress-bar"><i id="progress-fill"></i></div>
  </div>

  <main>
    <!-- CARICA -->
    <section id="view-upload" class="view">
      <div class="wrap">
        <label class="drop" id="drop">
          <input type="file" id="file-input" accept="image/*,video/*" multiple hidden />
          <strong>Trascina qui foto e video</strong>
          <span>oppure tocca per sceglierli</span>
        </label>
        <div class="row">
          <button class="btn" id="pick-files">Scegli file</button>
          <button class="btn ghost" id="pick-folder">Scegli una cartella intera</button>
          <input type="file" id="folder-input" webkitdirectory multiple hidden />
        </div>
        <p class="muted" id="upload-summary"></p>
        <ul class="queue" id="queue"></ul>
      </div>
    </section>

    <!-- CLASSIFICA (reels) -->
    <section id="view-tag" class="view">
      <div class="reels-layout">
        <div class="feed-col">
          <div class="feed-toolbar">
            <select id="filter"></select>
            <span class="muted" id="feed-pos"></span>
          </div>
          <div class="feed" id="feed"></div>
          <div class="empty" id="feed-empty" hidden></div>
        </div>
        <aside class="picker" id="picker">
          <div class="picker-head">
            <span>Di che trattamento fa parte?</span>
            <span class="current" id="current-label"></span>
          </div>
          <div class="cat-tabs" id="cat-tabs"></div>
          <div class="chips" id="chips"></div>
          <div class="picker-foot">
            <button class="chip discard" id="discard-btn">Da scartare</button>
            <button class="chip" id="skip-btn">Salta ↓</button>
          </div>
        </aside>
      </div>
    </section>

    <!-- CARTELLE -->
    <section id="view-folders" class="view">
      <div class="wrap">
        <div class="row between">
          <p class="muted" id="folders-summary"></p>
          <button class="btn" id="zip-all">Scarica tutto (ZIP con cartelle)</button>
        </div>
        <div id="folders"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
